<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ボタン1つで書き出す</title>
<!-- Claude Design のキャンバスから書き出したもの。PNG にする手順は store/listing.md を参照 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#1E88C8}a:hover{color:#156A9C}
</style>
</head>
<body>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #E8F3FA; font-family: 'Zen Kaku Gothic New', sans-serif; color: #0E2A3B; display: flex; align-items: center; gap: 48px; padding: 0 64px 0 80px; position: relative; overflow: hidden">
  <div style="width: 520px; flex-shrink: 0; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; align-items: center; gap: 12px">
      <svg width="40" height="40" viewBox="0 0 96 96" aria-hidden="true"><rect width="96" height="96" rx="22" fill="#1E88C8"></rect><path d="M20 24h56a6 6 0 0 1 6 6v30a6 6 0 0 1-6 6H44l-14 12V66H20a6 6 0 0 1-6-6V30a6 6 0 0 1 6-6z" fill="#FFFFFF"></path><path d="M26 56V34h7l6 9 6-9h7v22h-7V45l-6 8-6-8v11z" fill="#0E2A3B"></path><path d="M62 34h7v11h6L65.5 57 56 45h6z" fill="#1E88C8"></path></svg>
      <span style="font-size: 18px; font-weight: 700; letter-spacing: 0.01em">Chat to Markdown for Gemini</span>
    </div>
    <h1 style="margin: 0; font-size: 54px; line-height: 1.3; font-weight: 900; letter-spacing: 0.01em">Gemini の会話を、<br>そのまま<br>Markdown に。</h1>
    <p style="margin: 0; font-size: 20px; line-height: 1.8; color: #36505F">会話を開いて、ボタンを押すだけ。<br>ChatGPT や Claude に渡して、<br>続きから話せます。</p>
    <div style="display: flex; gap: 10px; flex-wrap: wrap">
      <span style="font-size: 15px; font-weight: 500; padding: 7px 14px; border-radius: 999px; background: #FFFFFF; color: #0E2A3B">自分の会話でも</span>
      <span style="font-size: 15px; font-weight: 500; padding: 7px 14px; border-radius: 999px; background: #FFFFFF; color: #0E2A3B">共有リンクでも</span>
      <span style="font-size: 15px; font-weight: 500; padding: 7px 14px; border-radius: 999px; background: #FFFFFF; color: #0E2A3B">画像も原寸で</span>
    </div>
  </div>
  <div style="flex: 1; position: relative; height: 520px">
    <div style="position: absolute; left: 0; top: 90px; width: 568px; border-radius: 16px; overflow: hidden; background: #FFFFFF; box-shadow: 0 1px 2px rgba(14,42,59,0.06), 0 20px 48px rgba(14,42,59,0.12)">
      <img src="gemini-page.png" alt="Gemini の会話の画面" style="display: block; width: 568px; height: 301px; object-fit: cover; object-position: center top">
    </div>
    <div style="position: absolute; right: 0; top: 20px; width: 280px; box-sizing: border-box; padding: 18px 20px 20px; background: #FFFFFF; border-radius: 12px; box-shadow: 0 2px 6px rgba(14,42,59,0.08), 0 24px 56px rgba(14,42,59,0.18); font-size: 14px; line-height: 1.5">
      <div style="font-weight: 700; margin-bottom: 12px">猫の月面宇宙服画像生成</div>
      <button type="button" style="width: 100%; padding: 10px 0; border: 0; border-radius: 999px; background: #1673AD; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700">ファイルに保存</button>
      <div style="margin-top: 12px; color: #36505F">保存しました（1 往復、画像 1 枚）</div>
    </div>
  </div>
</div>
</body>
</html>
